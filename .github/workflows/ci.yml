name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Build Docker image
        run: docker build -t app:test .

      - name: Run Docker image
        run: docker run -d --name app-test -p 3334:3334 app:test

      - name: Test application
        run: |
          docker ps -a
          
          for i in {1..10}; do
            if curl -v --fail http://localhost:3334/; then
              exit 0
            fi
          
            docker ps -a
            sleep 1
          done
          
          echo "=== Container logs ==="
          docker logs app-test || true
          
          echo "=== Container state ==="
          docker inspect app-test --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}'
          
          exit 1